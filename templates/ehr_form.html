{% extends "base.html" %}
{% block content %}

<h2>{{ 'Edit Patient' if patient else 'New Patient' }}</h2>

<form method="POST" enctype="multipart/form-data">

    <!-- TEXT INPUT -->
    <div class="mb-3">
        <label>Name</label>
        <input class="form-control" name="name" required
               value="{{ patient.name if patient else '' }}">
    </div>

    <!-- NUMBER INPUT -->
    <div class="mb-3">
        <label>Age</label>
        <input class="form-control" type="number" name="age"
               value="{{ patient.age if patient else '' }}">
    </div>

    <!-- RADIO -->
    <div class="mb-3">
        <label>Gender</label><br>
        <input type="radio" name="gender" value="Male"
            {% if patient and patient.gender == 'Male' %}checked{% endif %}> Male
        <input type="radio" name="gender" value="Female"
            {% if patient and patient.gender == 'Female' %}checked{% endif %}> Female
    </div>

    <!-- DATEPICKER (FLATPICKR) -->
    <div class="mb-3">
        <label>Last Visit</label>
        <input type="text" id="last_visit" name="last_visit"
               class="form-control"
               value="{{ patient.last_visit if patient else '' }}">
    </div>

    <!-- CHECKBOX -->
    <div class="mb-3">
        <label>Allergies</label><br>
        <input type="checkbox" name="allergies" value="Pollen"> Pollen
        <input type="checkbox" name="allergies" value="Dust"> Dust
        <input type="checkbox" name="allergies" value="Food"> Food
    </div>

    <!-- TEXTAREA -->
    <div class="mb-3">
        <label>Medical History</label>
        <textarea class="form-control" name="medical_history">{{ patient.medical_history if patient else '' }}</textarea>
    </div>

    <!-- IMAGE UPLOAD -->
    <div class="mb-3">
        <label>Patient Photo</label>
        <input class="form-control" type="file" name="image">
        {% if patient and patient.image_filename %}
            <img src="{{ url_for('uploaded_file', filename=patient.image_filename) }}"
                 width="120" class="mt-2">
        {% endif %}
    </div>

    <button class="btn btn-success">Save</button>
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
</form>

<!-- FLATPICKR INIT -->
<script>
    flatpickr("#last_visit", {
        dateFormat: "Y-m-d",
        allowInput: true
    });
</script>

{% endblock %}
