{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h3 class="mb-0">Doctor Login</h3>
            </div>
            <div class="card-body">
                {% if show_resend %}
                <div class="alert alert-warning">
                    <strong>Email not confirmed!</strong>
                    <p class="mb-2">Please check your email for the confirmation link.</p>
                    <form method="POST" action="{{ url_for('resend_confirmation') }}" class="d-inline">
                        <input type="hidden" name="email" value="{{ email }}">
                        <button type="submit" class="btn btn-sm btn-warning">Resend Confirmation Email</button>
                    </form>
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" required autofocus>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                
                <!-- ✅ ДОБАВЬТЕ ЭТУ СЕКЦИЮ -->
                <div class="text-center mt-3">
                    <a href="{{ url_for('forgot_password') }}" class="text-decoration-none">Forgot Password?</a>
                </div>
                <!-- ✅ КОНЕЦ ДОБАВЛЕНИЯ -->
                
                <hr>
                
                <div class="text-center">
                    <p class="mb-0">Don't have an account? <a href="{{ url_for('register') }}">Register here</a></p>
                    <p class="mb-0 mt-2"><small><a href="{{ url_for('resend_confirmation') }}">Resend confirmation email</a></small></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
